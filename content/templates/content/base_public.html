{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Easy Transit{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}News, recent trips and photos from Easy Transit.{% endblock %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f2f8f9;
            color: #0f172a;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .site-header {
            background: linear-gradient(135deg, #0f2a47 0%, #1e3a5f 60%, #10b981 100%);
            color: #fff;
            padding: 22px 16px 26px;
        }
        .site-header .inner {
            max-width: 1040px; margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between;
            gap: 16px; flex-wrap: wrap;
        }
        .site-header a.brand {
            color: #fff; text-decoration: none;
            font-size: 20px; font-weight: 800; letter-spacing: .3px;
            display: flex; align-items: center; gap: 9px;
        }
        .site-nav { display: flex; gap: 6px; flex-wrap: wrap; }
        .site-nav a {
            color: rgba(255,255,255,.9); text-decoration: none;
            font-size: 14px; font-weight: 600;
            padding: 7px 15px; border-radius: 20px;
            transition: background .2s ease;
        }
        .site-nav a:hover { background: rgba(255,255,255,.15); color: #fff; }
        .site-nav a.active { background: rgba(255,255,255,.22); color: #fff; }
        .site-nav a.cta { background: #fff; color: #0f2a47; }
        .site-nav a.cta:hover { background: #ecfdf5; }

        .page { flex: 1; max-width: 1040px; width: 100%; margin: 0 auto; padding: 32px 16px 48px; }

        .page-title { margin-bottom: 6px; font-size: 27px; font-weight: 800; color: #0f2a47; }
        .page-sub { color: #64748b; font-size: 15px; margin-bottom: 28px; }

        .empty {
            background: #fff; border: 2px dashed #cbd5e1; border-radius: 14px;
            padding: 46px 24px; text-align: center; color: #64748b;
        }
        .empty i { font-size: 34px; color: #94a3b8; display: block; margin-bottom: 12px; }

        .site-footer {
            background: #0f2a47; color: rgba(255,255,255,.75);
            text-align: center; font-size: 13px; padding: 22px 16px;
        }
        .site-footer a { color: #6ee7b7; text-decoration: none; font-weight: 600; }

        @media (max-width: 620px) {
            .site-header .inner { flex-direction: column; align-items: flex-start; }
            .page-title { font-size: 23px; }
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>

<header class="site-header">
    <div class="inner">
        <a href="{{ MAIN_SITE_URL }}" class="brand"><i class="bi bi-car-front-fill"></i> Easy Transit</a>
        <nav class="site-nav">
            <a href="{{ MAIN_SITE_URL }}"><i class="bi bi-house"></i> Main site</a>
            <a href="{% url 'content:blog_list' %}" class="{% if section == 'blog' %}active{% endif %}">News</a>
            <a href="{% url 'content:gallery' %}" class="{% if section == 'gallery' %}active{% endif %}">Gallery</a>
            <a href="/" class="cta"><i class="bi bi-calendar-check"></i> Book a ride</a>
        </nav>
    </div>
</header>

<main class="page">
    {% block content %}{% endblock %}
</main>

<footer class="site-footer">
    <p>
        <a href="{{ MAIN_SITE_URL }}">easytransit.co.zw</a> &middot;
        <a href="mailto:enquiries@easytransit.co.zw">enquiries@easytransit.co.zw</a>
    </p>
</footer>

</body>
</html>
